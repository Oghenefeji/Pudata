<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="pudata — everyday payments, made clear." />
    <title>pudata</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell" id="app">
      <header class="topbar">
        <button class="avatar-button" type="button" data-action="profile" aria-label="Open profile"><span data-avatar>G</span></button>
        <a class="brand" href="/" data-route="/" aria-label="pudata home"><span class="brand-mark">p</span><span class="brand-name">pudata</span></a>
        <button class="history-button" type="button" data-action="history" aria-label="Open history"><span aria-hidden="true">◷</span></button>
      </header>

      <main class="main-content" id="page-content"></main>

      <footer class="site-footer">
        <div><span class="brand-mark small">p</span><strong>pudata</strong><p>Everyday payments, made clear.</p></div>
        <div class="footer-links"><a href="/terms" data-route="/terms">Terms</a><a href="/privacy" data-route="/privacy">Privacy</a><a href="mailto:teamfeji4@gmail.com">teamfeji4@gmail.com</a></div>
      </footer>

      <nav class="bottom-nav" aria-label="Primary navigation">
        <button class="bottom-nav-item active" type="button" data-route="/"><span>⌂</span><span>Home</span></button>
        <button class="bottom-nav-item" type="button" data-action="fund-wallet"><span>＋</span><span>Wallet</span></button>
        <button class="bottom-nav-item" type="button" data-action="history"><span>◷</span><span>History</span></button>
        <button class="bottom-nav-item" type="button" data-action="more"><span>•••</span><span>More</span></button>
      </nav>
    </div>

    <div class="drawer-backdrop" data-action="close-menu"></div>
    <aside class="side-drawer" aria-label="More menu" aria-hidden="true" id="drawer">
      <div class="drawer-top"><span class="drawer-label">MORE</span><button class="icon-button" type="button" data-action="close-menu" aria-label="Close menu">×</button></div>
      <div class="drawer-brand"><span class="brand-mark">p</span><span class="brand-name">pudata</span></div>
      <div class="drawer-links" id="drawer-links"></div>
      <div class="drawer-footer"><a href="mailto:teamfeji4@gmail.com">teamfeji4@gmail.com</a></div>
    </aside>

    <div class="modal-layer" id="modal-layer" aria-hidden="true">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="modal-close" type="button" data-action="close-modal" aria-label="Close dialog">×</button>
        <div class="modal-kicker" id="modal-kicker">PUDATA</div>
        <h2 id="modal-title">Make a payment</h2>
        <p class="modal-intro" id="modal-intro"></p>
        <div id="modal-body"></div>
      </section>
    </div>
    <div class="toast" role="status" aria-live="polite" id="toast"></div>

    <script src="https://checkout.flutterwave.com/v3.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
